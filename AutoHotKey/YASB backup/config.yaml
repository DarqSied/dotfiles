  #    brightness_icons: [
  #      "\ue706",
  #      "\ue706",
  #      "\ue706",
  #      "\ue706"
  #    ]
  #    brightness_menu:
  #      blur: true
  #      round_corners: true
  #      round_corners_type: "normal"
  #      border_color: "System"
  #      alignment: "right"
  #      direction: "down"
  #      brightness_icon: "\ue706"
  #      contrast_icon: "\ue7a1"
  #    callbacks:
  #      on_left: "toggle_brightness_menu"
  #      on_right: "toggle_label"

  update_check:
    type: "yasb.update_check.UpdateCheckWidget"
    options:
      winget_update:
        enabled: true
        label: "<span>\uf019</span> {count}"
        interval: 10080       # 10080 mins = 7 days
        exclude: []
      windows_update:
        enabled: true
        label: "<span>\uf17a</span> {count}"
        interval: 10080       # 10080 mins = 7 days
        exclude: []

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\ue9d9</span> {info[percent][total]}%"
      label_alt: "<span>\ue9d9</span> {info[freq][current]} MHz"
      update_interval: 2000
      callbacks:
        on_left: "toggle_label"
        on_right: "exec cmd.exe /c start taskmgr"

  memory:
      type: "yasb.memory.MemoryWidget"
      options:
        label: "<span>\uefc5</span> {virtual_mem_used}/{virtual_mem_total}"
        label_alt: "<span>\uefc5</span> {virtual_mem_percent}% ({virtual_mem_free} free)"
        update_interval: 3000
        callbacks:
          on_left: "toggle_label"

  gpu_grouper:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "gpu-pill"
      widgets:
        - "igpu"
        - "dgpu"

  igpu:
    type: "yasb.gpu.GpuWidget"
    options:
      gpu_index: 0              # Swap 0 and 1 if Windows lists your dGPU as index 0
      label: "<span>\ue950</span> iGPU {info[utilization]}%"
      label_alt: "<span>\ue950</span> {info[name]} ({info[temp]}°C)"
      update_interval: 2000
      menu:
        enabled: true
        blur: true
        round_corners: true
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 4
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_menu"

  dgpu:
    type: "yasb.gpu.GpuWidget"
    options:
      gpu_index: 1
      label: "dGPU {info[utilization]}%"
      label_alt: "{info[name]} ({info[temp]}°C | {info[mem_used]}/{info[mem_total]} MB)"
      update_interval: 2000
      menu:
        enabled: true
        blur: true
        round_corners: true
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 4
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_menu"

  traffic:
    type: "yasb.traffic.TrafficWidget"
    options:
      label: "<span>\ue74a</span> {upload_speed}  <span class=\"dl-icon\">\ue74b</span> {download_speed}"
      label_alt: "<span>\ue74a</span> {upload_speed} ({bytes_sent})  <span class=\"dl-icon\">\ue74b</span> {download_speed} ({bytes_recv})"
      update_interval: 1000
      callbacks:
        on_left: "toggle_label"
        on_right: "exec cmd.exe /c start ms-settings:network-status"

  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span>{icon}</span> {percent}%"
      label_alt: "<span>{icon}</span> {percent}% ({time_remaining})"
      update_interval: 5000
      hide_unsupported: false
      charging_options:
        icon_format: "{charging_icon}"   # FIXED: Renders only ONE charging battery icon
        blink_charging_icon: false
      status_thresholds:
        critical: 15
        low: 30
        medium: 60
        high: 90
        full: 100
      status_icons:
        icon_charging: "\ue83e"
        icon_critical: "\ue851"
        icon_low: "\ue853"
        icon_medium: "\ue855"
        icon_high: "\ue858"
        icon_full: "\ue83f"
      callbacks:
        on_left: "toggle_label"